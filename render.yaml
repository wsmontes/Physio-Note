# Render Blueprint for Physio-Note
# This file defines all services needed for deployment

services:
  # Backend API Server
  - type: web
    name: physio-note-api
    env: node
    region: oregon # Choose closest to your users
    plan: starter # $7/month - upgrade to standard ($25/mo) for production
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Auto-generate secure secret
      - key: OPENAI_API_KEY
        sync: false # Set manually in Render dashboard
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: OPENAI_WHISPER_MODEL
        value: whisper-1
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: physio-note-client
          property: url

  # Frontend Client
  - type: web
    name: physio-note-client
    env: static
    region: oregon
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: physio-note-api
          property: url
          envVarKey: VITE_API_URL

# Database: MongoDB Atlas (External)
# You need to create this separately at https://cloud.mongodb.com
# and add the connection string to MONGODB_URI in Render dashboard
